name: Build MSI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: msi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install cx_Freeze==8.7.4

      - name: Build MSI
        run: python setup_msi.py bdist_msi

      - name: Verify build
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem dist -Filter *.msi)
          if ($msi.Count -ne 1) {
            throw "Expected exactly one MSI, found $($msi.Count)"
          }
          if ($msi[0].Length -lt 10MB) {
            throw "MSI is unexpectedly small: $($msi[0].Length) bytes"
          }
          $exe = @(Get-ChildItem build -Recurse -Filter DynamicIsland.exe)
          if ($exe.Count -lt 1) {
            throw "DynamicIsland.exe was not built"
          }
          $locales = @(Get-ChildItem build -Recurse -Filter messages.json)
          if ($locales.Count -lt 2) {
            throw "Locale catalogs are missing from the frozen build"
          }
          Get-Item $msi[0].FullName | Select-Object Name, Length

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: DynamicIsland-msi
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download MSI
        uses: actions/download-artifact@v8
        with:
          name: DynamicIsland-msi
          path: dist

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "${{ github.ref_name }}"
          $msi = (Get-ChildItem dist -Filter *.msi | Select-Object -First 1).FullName
          gh release view $tag --json tagName | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $msi --clobber
          } else {
            gh release create $tag $msi --title "Dynamic Island $tag" --generate-notes
          }
